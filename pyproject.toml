[project]
name = "rostering-problem"
version = "0.1.0"
description = "Hospital doctor rostering optimization problem using CP-SAT solver"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.1.0",
    "altair>=5.0.0",
    "ortools>=9.7.0",
    "streamlit-calendar>=1.4.0",
    "plotly>=7.1.0",
    "vl-convert-python>=1.9.0.post1",
    "kaleido>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
